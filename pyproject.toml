
# ==================================================================================
# Project Metadata
# Defines core information about the package.
# ==================================================================================
[project]
name = "robometer-policy-learning"
version = "0.0.1"
readme = "README.md"
requires-python = "==3.11.*"

# ==================================================================================
# Dependencies
# This section lists the direct dependencies of your project.
# It is best practice to list only the packages your code directly imports,
# not every package from your environment. Tools like 'uv' or 'pip' will
# resolve and install the dependencies of these packages automatically.
# ==================================================================================
dependencies = [
    # Core ML/RL libraries
    "torch>=2.0.0",
    "torchvision",
    "gymnasium>=0.29.0",
    "gym",
    "metaworld",
    # Model libraries (for reward models and transformers)
    "transformers>=4.57.0",
    "sentence-transformers>=2.0.0",
    "huggingface-hub>=0.35.0",
    # Data handling
    "h5py>=3.10.0",
    "numpy>=1.21.0",
    "pyyaml>=6.0.0",
    # Logging
    "wandb>=0.20.1",
    "tensorboard>=2.14.0",
    "loguru",
    # Utilities
    "tqdm>=4.67.1",
    "rich>=14.0.0",
    "omegaconf>=2.3.0",
    # Image processing (for vision-based RL)
    "pillow>=9.0.0",
    "opencv-python-headless>=4.8.0",
    "imageio>=2.37.0",
    # Used directly by rollouts/dsrl_evaluation_worker.py and required by LIBERO
    # (libero/libero/envs/env_wrapper.py imports matplotlib.cm). Previously satisfied only
    # transitively via the unsloth/robometer stack, so it must be declared explicitly.
    "matplotlib>=3.7",
    # NOTE: unsloth / unsloth-zoo / xformers / trl live in the `robometer` extra, not here: they are
    # only used by the reward-model path (RoboReward inference in the reward-relabel server) and
    # xformers==0.0.32.post2 forces torch==2.8.0, which is incompatible with openpi's torch==2.7.1.
    "grpcio-tools>=1.76",
    "hydra-core==1.3.2",
    "cmake<4.0",
    # LIBERO dependencies (the LIBERO checkout itself is the `libero` extra -- see below)
    "easydict==1.9",
    "robomimic==0.2.0",
    "thop==0.1.1.post2209072238",
    "robosuite==1.4.0",
    "bddl==1.0.1",
    "future==0.18.2",
    "cloudpickle==2.1.0",
    # OpenPI (Pi0) -- the openpi checkout itself is the `openpi` extra (see below)
    "diffusers>=0.38.0",
    "pynput>=1.8.2",
    "hidapi>=0.15.0",
    "moviepy>=2.2.1",
]

[project.urls]
Repository = "https://github.com/ygtkorkmaz/rfm_rl"

# ==================================================================================
# Optional Dependencies
# These are groups of dependencies for specific purposes, like development or
# running optional features. Install with `uv pip install .[dev]`
# ==================================================================================
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "ipykernel",
    "ipywidgets",
    "ipdb>=0.13.13",
    # Box2D envs (LunarLander) for integration tests
    "swig>=4.0.0",
    "box2d-py>=2.3.5",
    "pygame>=2.1.0",
]

# ----------------------------------------------------------------------------------
# Git-submodule checkouts under third_party/ (see .gitmodules), as DEPENDENCY GROUPS
# rather than hard dependencies, so an environment installs only what a given workflow
# needs. Groups (not extras) on purpose: `[tool.uv] default-groups` makes the pi0/LIBERO
# set the default for a plain `uv run` / `uv sync`, whereas uv has no `default-extras`
# setting -- without that, a plain `uv run` would re-sync to a set that drops openpi's
# torch==2.7.1 pin and silently bump torch to 2.8.0.
#
#     uv sync                                          # pi0 / LIBERO (the default)
#     uv sync --group robometer --no-default-groups     # the reward-model path
#
# `robometer` is mutually exclusive with `openpi`: robometer pins datasets==4.1.1 and
# (via xformers) torch==2.8.0, while openpi pins datasets<4 and torch==2.7.1, so they
# cannot be resolved together. Declared in [tool.uv] conflicts below, which lets uv lock
# each combination separately instead of failing the whole lock.
# ----------------------------------------------------------------------------------
[dependency-groups]
libero = ["libero"]
openpi = ["openpi"]
# LIBERO-plus (third_party/LIBERO-plus) is deliberately NOT installed -- it ships the same top-level
# `libero` package as LIBERO, so the two cannot co-exist in one environment. It is selected per run by
# `env.libero_plus=true`, which makes robometer_policy_learning/envs/libero_plus.py shadow the
# installed LIBERO on sys.path. Only its two extra runtime deps are installed here: LIBERO-plus's
# envs/env_wrapper.py imports both at module import time for the Sensor Noise corruptions, so they are
# needed for ANY LIBERO-plus env. `wand` also needs the system ImageMagick library
# (`sudo apt-get install -y libmagickwand-dev`); without it activate() stubs `wand` out and only
# motion-blur tasks (`_noise_N`, N<=10) fail.
libero-plus = ["wand>=0.6", "scikit-image>=0.24"]
# The reward-model path: the robometer checkout plus the LLM-finetuning stack it needs.
robometer = [
    "robometer",
    "unsloth==2025.10.11",
    "unsloth-zoo==2025.10.12",
    "xformers==0.0.32.post2",
    "trl==0.20.0",
]

# Paths match the git submodules under third_party/ (see .gitmodules). The PyPI name
# "openpi" is installed from the dsrl_openpi checkout.
[tool.uv.sources]
robometer = { path = "./third_party/robometer", editable = true }
libero = { path = "./third_party/LIBERO", editable = true }
openpi = { path = "./third_party/dsrl_openpi", editable = true }

# ==================================================================================
# Build System
# Specifies how your project should be packaged. Hatchling is a modern,
# fast, and recommended build backend.
# ==================================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robometer_policy_learning"]

[tool.hatch.metadata]
allow-direct-references = true

# ==================================================================================
# Tool Configuration
# Settings for various development tools like 'uv', 'ruff' (linter), etc.
# ==================================================================================

# Configuration for the 'uv' package manager
[tool.uv]
# robometer (datasets==4.1.1) and openpi (datasets<4) cannot co-exist in one resolution.
# Declaring them as conflicting extras lets uv lock each combination separately instead
# of failing the whole lock.
conflicts = [[{ group = "robometer" }, { group = "openpi" }]]
# The pi0/LIBERO groups are the DEFAULT install set, so a plain `uv run` (as used by
# scripts/hitl_pi0_loop.py) keeps openpi's torch==2.7.1 pin instead of re-syncing to a set that
# silently bumps torch to 2.8.0 and churns the CUDA stack.
# `libero-plus` is in the default set on purpose: `uv run` re-syncs the environment and would PRUNE
# wand/scikit-image if they lived in a non-default group, silently breaking `env.libero_plus=true`.
default-groups = ["openpi", "libero", "libero-plus"]
extra-build-dependencies = { egl-probe = ["cmake<4.0"] }
override-dependencies = [
    "transformers>=4.57.0,<5",
    "jax[cuda12]>=0.5.3,<0.7.0",  # 0.6.x has better bf16 support but keeps DeviceLocalLayout API
    "gymnasium>=1.2.2", # override lerobot dependency (stemming from openpi repo)
    "protobuf>3.21",
]


# Tool configuration for the 'ruff' linter and formatter
[tool.ruff]
line-length = 120
target-version = "py311"
fix = true
unsafe-fixes = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = ["T201"]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = true

# ==================================================================================
# Pytest Configuration
# ==================================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that build envs + models (may be slow)",
]
addopts = "-v --tb=short"

