# Online SAC in the robosuite env reconstructed from a robomimic dataset (low-dim obs).
#
# The dataset is NOT used as training data: env.h5_dataset_path only defines the env (task, robot,
# controller, control_freq and scene are read from its env metadata by setup_robomimic_env), so the
# policy trains in exactly the env the demos were collected in. Reward is robosuite's dense shaping.
#
# Usage:
#   uv run python scripts/train.py --config-name=robomimic_lowdim_sac \
#     env.h5_dataset_path=data/robomimic_datasets/robomimic_lowdim/lift/ph/low_dim_converted.hdf5
defaults:
  - algorithm@offline_algorithm: null
  - algorithm@online_algorithm: sac
  - reward_model: null
  - policy@policy: mlp # Options: mlp, rnn, transformer
  - value_function@value_function: mlp # Options: mlp, rnn, transformer

# Debug mode
debug: false

# Environment configuration
env:
  env_name: "robomimic"  # task/robot/controller are read from the robomimic dataset metadata
  h5_dataset_path: "data/robomimic_datasets/robomimic_lowdim/lift/ph/low_dim_converted.hdf5"
  max_episode_steps: 400
  use_full_state: true  # proprio + object-state (the low-dim datasets' state)
  use_gt_rewards: true  # env (dense, shaped) reward
  dino_image_keys: null
  # The env always renders cameras; drop them so the actor/critic see only `state`.
  extra_keys_to_drop: ["agentview_image", "robot0_eye_in_hand_image", "prompt", "language"]
  success_bonus_amount: 0.0

# Training configuration
training:
  num_envs: 1
  num_rollouts: 1_000_000  # online env steps
  chunk_size: null
  n_action_steps: 1
  use_rnn: false
  num_offline_steps: 0  # unused (no offline_algorithm)
  load_dir: null
  save_interval: 50000
  continue_training: false
  seed: 0

# Replay buffer configuration
buffer:
  capacity: 1_000_000
  sample_ratio: 0.0  # no offline buffer
  use_success_fail_buffer: false
  success_fail_sample_ratio: 0.5
  success_detection_duration: 2
  success_detection_threshold: 0.65
  distributed_reward_relabel:
    enabled: false
    server_address: "localhost:50052"
    max_queue_size: 100
    timeout: 60.0
    flush_interval: 0.1

# Logging configuration
logging:
  wandb_project: mile_dp
  wandb_entity: ykorkmaz
  wandb_offline: false
  wandb_log_dir_base: logs/wandb
  wandb_name: "robomimic_lowdim_sac"
  log_level: "INFO"

# Algorithm configuration
alg:
  # Placeholder: critic construction is keyed off offline_alg_name (bc/dp/flow build no critic).
  offline_alg_name: iql
  online_alg_name: sac

# Evaluation configuration
eval:
  eval_freq: 20000  # in env steps
  eval_num_episodes: 20
  eval_record_video: true
  eval_on_first_step: false

# Model configuration
model:
  dinov2_model: null
  sentence_model: null
  image_encoder:
    type: null  # null | impala | resnet | dinov2 | vit
    finetune: false
    image_feature_dim: 128
    resnet_backbone: ResNet18
    resnet_pretrained: true
    resnet_pool: spatial_softmax
    spatial_softmax_num_kp: 32
    impala_nn_scale: 1
    impala_num_blocks_per_stack: 2
    impala_use_smaller: false
    impala_output_dim: null
    vit_model: google/vit-base-patch16-224-in21k
    vit_processor: null
    vit_pool: cls
    vit_image_size: null
    vit_projection_dim: null
